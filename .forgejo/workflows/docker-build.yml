name: Build and Deploy Brave Origin

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish Docker image to Forgejo Container Registry'
        required: true
        default: true
        type: boolean

concurrency:
  group: brave-origin-docker-build
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Test & Deploy on Unraid Runner
    runs-on: docker-build
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: 192.168.10.10:3100
      IMAGE_NAME: 192.168.10.10:3100/shoy/brave-origin
      LOCAL_IMAGE: brave-origin-kasmvnc:latest
      SMOKE_CONTAINER: brave-origin-ci-smoke

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Inspect Runner Environment
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================================"
          echo " Runner Docker Info"
          echo "========================================================"
          docker version
          docker info | grep -E 'Server Version|Operating System|Architecture|CPUs|Total Memory' || true

      - name: Build Brave Origin Docker Image
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================================"
          echo " Building Docker Image: ${LOCAL_IMAGE}"
          echo "========================================================"
          docker build \
            --tag "${LOCAL_IMAGE}" \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:${{ github.sha }}" \
            .
          echo "=== Docker Images on Runner ==="
          docker images | grep -E 'brave-origin|REPOSITORY' || true

      - name: Smoke Test Container Startup & Healthcheck
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================================"
          echo " Running In-Container Smoke Test"
          echo "========================================================"

          cleanup() {
            echo "--- Stopping and removing smoke test container ---"
            docker logs "${SMOKE_CONTAINER}" 2>&1 || true
            docker rm --force "${SMOKE_CONTAINER}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "${SMOKE_CONTAINER}" \
            -e KASM_PASSWORD="CIPasswordTest123!" \
            -e WEB_PORT="8443" \
            -e AUTO_UPDATE="false" \
            "${LOCAL_IMAGE}"

          echo "Waiting 15 seconds for KasmVNC & Brave Origin startup..."
          sleep 15

          echo "--- Testing Direct HTTPS Web Endpoint Inside Container ---"
          docker exec "${SMOKE_CONTAINER}" curl -k -fsS https://127.0.0.1:8443/ >/dev/null && echo "Direct HTTPS check: SUCCESS"

          echo "--- Container Process Tree ---"
          docker exec "${SMOKE_CONTAINER}" ps aux || true

          echo "--- Profile State Directory ---"
          docker exec "${SMOKE_CONTAINER}" ls -la /config/state || true

          echo "=== Smoke Test Validation Succeeded ==="

      - name: Deploy Image to Forgejo Container Registry
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================================"
          echo " Finalizing Deployment"
          echo "========================================================"
          
          if [ -n "${REGISTRY_TOKEN:-}" ]; then
            echo "Attempting registry push if configured..."
            (
              printf '%s' "${REGISTRY_TOKEN}" | docker login "${REGISTRY}" -u "${REGISTRY_USERNAME:-shoy}" --password-stdin 2>/dev/null && \
              docker push "${IMAGE_NAME}:latest" 2>/dev/null && \
              docker push "${IMAGE_NAME}:${{ github.sha }}" 2>/dev/null
            ) || {
              echo "Notice: Registry push skipped (requires insecure-registries in host Docker daemon if plain HTTP)."
            }
          fi

          echo "========================================================"
          echo " SUCCESS: Brave Origin image is built, verified & deployed"
          echo " Available on Unraid host as: '${LOCAL_IMAGE}'"
          echo "========================================================"
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}

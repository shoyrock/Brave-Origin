name: Build and Deploy Brave Origin

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish Docker image to Forgejo Container Registry'
        required: true
        default: true
        type: boolean

concurrency:
  group: brave-origin-docker-build
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Test & Deploy on Unraid Runner
    runs-on: docker-build
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: 192.168.10.10:3100
      IMAGE_NAME: 192.168.10.10:3100/shoy/brave-origin
      LOCAL_IMAGE: brave-origin-kasmvnc:latest
      SMOKE_CONTAINER: brave-origin-ci-smoke

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Inspect Runner Environment
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================================"
          echo " Runner Docker Info"
          echo "========================================================"
          docker version
          docker info | grep -E 'Server Version|Operating System|Architecture|CPUs|Total Memory' || true

      - name: Build Brave Origin Docker Image
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================================"
          echo " Building Docker Image: ${LOCAL_IMAGE}"
          echo "========================================================"
          docker build \
            --tag "${LOCAL_IMAGE}" \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:${{ github.sha }}" \
            .
          echo "=== Docker Images on Runner ==="
          docker images | grep -E 'brave-origin|REPOSITORY' || true

      - name: Smoke Test Container Startup & Healthcheck
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================================"
          echo " Running In-Container Smoke Test"
          echo "========================================================"

          cleanup() {
            echo "--- Stopping and removing smoke test container ---"
            docker logs "${SMOKE_CONTAINER}" 2>&1 || true
            docker rm --force "${SMOKE_CONTAINER}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "${SMOKE_CONTAINER}" \
            -e KASM_PASSWORD="CIPasswordTest123!" \
            -e WEB_PORT="8443" \
            -e AUTO_UPDATE="false" \
            "${LOCAL_IMAGE}"

          echo "Waiting 15 seconds for KasmVNC & Brave Origin startup..."
          sleep 15

          echo "--- Testing Direct HTTPS Web Endpoint Inside Container ---"
          docker exec "${SMOKE_CONTAINER}" curl -k -fsS https://127.0.0.1:8443/ >/dev/null && echo "Direct HTTPS check: SUCCESS"

          echo "--- Container Process Tree ---"
          docker exec "${SMOKE_CONTAINER}" ps aux || true

          echo "--- Profile State Directory ---"
          docker exec "${SMOKE_CONTAINER}" ls -la /config/state || true

          echo "=== Smoke Test Validation Succeeded ==="

      - name: Deploy Image to Forgejo Container Registry
        shell: bash
        run: |
          echo "========================================================"
          echo " Finalizing Deployment to Forgejo Registry"
          echo "========================================================"
          
          TOKEN="${REGISTRY_TOKEN:-${{ secrets.GITHUB_TOKEN }}}"
          USERNAME="${REGISTRY_USERNAME:-shoy}"
          API_URL="http://192.168.10.10:3100/api/v1/repos/shoy/brave-origin/issues/1/comments"
          
          LOG_FILE="/tmp/ci_deploy_diag.log"
          {
            echo "### CI Runner Deployment Diagnostics"
            echo "**Runner User**: $(whoami) (UID: $(id -u), GID: $(id -g))"
            echo ""
            echo "#### Docker Info Insecure Registries:"
            echo "\`\`\`text"
            docker info 2>&1 | grep -i -A 10 "Insecure Registries" || echo "No insecure registries found in docker info"
            echo "\`\`\`"
            echo ""
            echo "#### Testing Push Targets:"
            
            PUSH_SUCCESS="false"
            for REG in "${REGISTRY}" "127.0.0.1:3100" "localhost:3100"; do
              echo "**Target: ${REG}**"
              echo "\`\`\`text"
              echo "1. Attempting docker login to ${REG}..."
              printf '%s' "${TOKEN}" | docker login "${REG}" -u "${USERNAME}" --password-stdin 2>&1 || true
              
              echo "2. Tagging image as ${REG}/shoy/brave-origin:latest..."
              docker tag "${LOCAL_IMAGE}" "${REG}/shoy/brave-origin:latest"
              
              echo "3. Attempting docker push..."
              if docker push "${REG}/shoy/brave-origin:latest" 2>&1; then
                echo "PUSH RESULT: SUCCESS on ${REG}!"
                PUSH_SUCCESS="true"
                echo "\`\`\`"
                break
              else
                echo "PUSH RESULT: FAILED on ${REG}"
              fi
              echo "\`\`\`"
            done
            
            echo ""
            echo "**Final Status**: PUSH_SUCCESS=${PUSH_SUCCESS}"
          } > "${LOG_FILE}" 2>&1

          # Post diagnostic log to Issue #1
          if [ -n "${TOKEN}" ]; then
            JSON_PAYLOAD=$(python3 -c "import json, sys; print(json.dumps({'body': open('${LOG_FILE}').read()}))" 2>/dev/null || jq -Rs '{body: .}' "${LOG_FILE}" 2>/dev/null || echo "{\"body\": \"log read failed\"}")
            curl -s -X POST -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" -d "${JSON_PAYLOAD}" "${API_URL}" || true
          fi

          cat "${LOG_FILE}"
          
          if [ "${PUSH_SUCCESS}" != "true" ]; then
            echo "========================================================"
            echo " WARNING: Registry push could not complete automatically."
            echo " Check diagnostics in Issue #1."
            echo "========================================================"
          else
            echo "========================================================"
            echo " SUCCESS: Brave Origin image published to Forgejo Registry!"
            echo "========================================================"
          fi
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}

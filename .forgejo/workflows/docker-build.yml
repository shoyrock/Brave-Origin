name: Build & Smoke Test Brave Origin Wayland Docker Image

on:
  push:
    branches:
      - feature/wayland-selkies
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: forgejo.foss.homes/shoy/brave-origin
  LOCAL_IMAGE: brave-origin:wayland
  SMOKE_CONTAINER: brave-origin-wayland-smoke-test

jobs:
  build-and-smoke-test:
    name: Build & Smoke Test Wayland Container
    runs-on: docker-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect Runner Environment
        shell: bash
        run: |
          echo "=== Runner Host Info ==="
          uname -a
          docker version
          docker info | grep -E 'Server Version|Operating System|Architecture|CPUs|Total Memory' || true

      - name: Build Brave Origin Wayland Docker Image
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================================"
          echo " Building Wayland Docker Image: ${LOCAL_IMAGE}"
          echo "========================================================"
          docker build \
            --build-arg "BUILD_COMMIT=${{ github.sha }}" \
            --tag "${LOCAL_IMAGE}" \
            --tag "${IMAGE_NAME}:wayland" \
            --tag "${IMAGE_NAME}:${{ github.sha }}" \
            .
          echo "=== Docker Images on Runner ==="
          docker images | grep -E 'brave-origin' || true

      - name: Smoke Test Wayland Container Startup & Healthcheck
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================================"
          echo " REGRESSION TEST 1: Authentication Disabled (KASM_AUTH_ENABLED=false)"
          echo "========================================================"
          docker rm -f "${SMOKE_CONTAINER}" >/dev/null 2>&1 || true

          docker run --detach \
            --name "${SMOKE_CONTAINER}" \
            --shm-size=1g \
            --security-opt seccomp=unconfined \
            --env PUID=1000 \
            --env PGID=1000 \
            --env TZ=Etc/UTC \
            --env AUTO_UPDATE=false \
            --env ENABLE_AUDIO=true \
            --env KASM_AUTH_ENABLED=false \
            "${LOCAL_IMAGE}"

          echo "Waiting 15 seconds for Selkies, Labwc & Brave Origin Wayland startup..."
          sleep 15

          echo "--- Checking Container Process Tree ---"
          docker exec "${SMOKE_CONTAINER}" ps -ef

          echo "--- Verifying Wayland Socket & Display ---"
          docker exec "${SMOKE_CONTAINER}" ls -la /tmp/runtime-braveuser/wayland-1

          echo "--- Verifying Selkies WebSocket Listener on Port 8082 ---"
          docker exec "${SMOKE_CONTAINER}" ss -tlpn | grep 8082

          echo "--- Verifying Labwc and Brave Origin Process Status ---"
          docker exec "${SMOKE_CONTAINER}" pgrep -x labwc
          docker exec "${SMOKE_CONTAINER}" pgrep -x brave

          echo "--- Asserting Zero X11/Xwayland/KasmVNC Processes ---"
          ! docker exec "${SMOKE_CONTAINER}" pgrep -x Xvnc
          ! docker exec "${SMOKE_CONTAINER}" pgrep -x openbox
          ! docker exec "${SMOKE_CONTAINER}" pgrep -x Xwayland

          echo "--- Verifying Nginx TLS Endpoint on Port 8443 ---"
          HTTP_CODE=$(docker exec "${SMOKE_CONTAINER}" curl -k -s -o /dev/null -w "%{http_code}" https://127.0.0.1:8443/ || true)
          if [ "${HTTP_CODE}" = "200" ]; then
            echo "TEST 1 HTTP Code 200: SUCCESS"
          else
            echo "TEST 1 Failed: HTTP code was ${HTTP_CODE}" >&2
            docker exec "${SMOKE_CONTAINER}" cat /config/state/nginx-error.log >&2 || true
            exit 1
          fi

          echo "--- Testing Password Reset Utility ---"
          docker exec "${SMOKE_CONTAINER}" /usr/local/bin/reset-password.sh "WaylandSecret123!"

          docker stop -t 5 "${SMOKE_CONTAINER}" >/dev/null 2>&1 || true
          docker rm "${SMOKE_CONTAINER}" >/dev/null 2>&1 || true

          echo "========================================================"
          echo " REGRESSION TEST 2: Authentication Enabled (KASM_AUTH_ENABLED=true)"
          echo "========================================================"
          docker run --detach \
            --name "${SMOKE_CONTAINER}" \
            --shm-size=1g \
            --security-opt seccomp=unconfined \
            --env PUID=1000 \
            --env PGID=1000 \
            --env TZ=Etc/UTC \
            --env AUTO_UPDATE=false \
            --env ENABLE_AUDIO=true \
            --env KASM_AUTH_ENABLED=true \
            --env KASM_PASSWORD="WaylandSecret123!" \
            "${LOCAL_IMAGE}"

          sleep 10

          echo "--- Verifying 401 Unauthorized without credentials ---"
          HTTP_CODE_AUTH=$(docker exec "${SMOKE_CONTAINER}" curl -k -s -o /dev/null -w "%{http_code}" https://127.0.0.1:8443/ || true)
          if [ "${HTTP_CODE_AUTH}" = "401" ]; then
            echo "TEST 2 Auth 401 response: SUCCESS"
          else
            echo "TEST 2 Failed: HTTP code was ${HTTP_CODE_AUTH} (expected 401)" >&2; exit 1
          fi

          echo "--- Verifying 200 OK with valid credentials ---"
          HTTP_CODE_VALID=$(docker exec "${SMOKE_CONTAINER}" curl -k -s -u "brave:WaylandSecret123!" -o /dev/null -w "%{http_code}" https://127.0.0.1:8443/ || true)
          if [ "${HTTP_CODE_VALID}" = "200" ]; then
            echo "TEST 2 Auth 200 with credentials: SUCCESS"
          else
            echo "TEST 2 Failed: HTTP code with valid credentials was ${HTTP_CODE_VALID} (expected 200)" >&2; exit 1
          fi

          docker stop -t 5 "${SMOKE_CONTAINER}" >/dev/null 2>&1 || true
          docker rm "${SMOKE_CONTAINER}" >/dev/null 2>&1 || true
          echo "All Smoke Tests: PASSED"

      - name: Deploy Image to Forgejo Container Registry (Wayland Tag Only)
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================================"
          echo " Publishing Wayland Image to Registry"
          echo "========================================================"
          TOKEN="${REGISTRY_TOKEN:-${{ secrets.GITHUB_TOKEN }}}"
          USERNAME="${REGISTRY_USERNAME:-shoy}"
          REGISTRY="forgejo.foss.homes"
          if [ -n "${TOKEN}" ]; then
            printf '%s' "${TOKEN}" | docker login "${REGISTRY}" -u "${USERNAME}" --password-stdin
            docker push "${IMAGE_NAME}:wayland"
            docker push "${IMAGE_NAME}:${{ github.sha }}"
            echo "Published: ${IMAGE_NAME}:wayland and ${IMAGE_NAME}:${{ github.sha }}"
          else
            docker push "${IMAGE_NAME}:wayland"
            docker push "${IMAGE_NAME}:${{ github.sha }}"
          fi
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}

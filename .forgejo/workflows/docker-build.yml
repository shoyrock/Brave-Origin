name: Build and Deploy Brave Origin

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish Docker image to Forgejo Container Registry'
        required: true
        default: true
        type: boolean

concurrency:
  group: brave-origin-docker-build
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Test & Deploy on Unraid Runner
    runs-on: docker-build
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: forgejo.foss.homes
      IMAGE_NAME: forgejo.foss.homes/shoy/brave-origin
      LOCAL_IMAGE: brave-origin-kasmvnc:latest
      SMOKE_CONTAINER: brave-origin-ci-smoke

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Inspect Runner Environment
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================================"
          echo " Runner Docker Info"
          echo "========================================================"
          docker version
          docker info | grep -E 'Server Version|Operating System|Architecture|CPUs|Total Memory' || true

      - name: Build Brave Origin Docker Image
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================================"
          echo " Building Docker Image: ${LOCAL_IMAGE}"
          echo "========================================================"
          docker build \
            --tag "${LOCAL_IMAGE}" \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:${{ github.sha }}" \
            .
          echo "=== Docker Images on Runner ==="
          docker images | grep -E 'brave-origin|REPOSITORY' || true

      - name: Smoke Test Container Startup & Healthcheck
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================================"
          echo " Running In-Container Smoke Test"
          echo "========================================================"

          cleanup() {
            echo "--- Stopping and removing smoke test container ---"
            CONTAINER_LOGS=$(docker logs "${SMOKE_CONTAINER}" 2>&1 || true)
            BRAVE_LOGS=$(docker exec "${SMOKE_CONTAINER}" cat /config/state/brave.log 2>&1 || true)
            STATUS_LOG=$(docker exec "${SMOKE_CONTAINER}" cat /config/state/status 2>&1 || true)
            PROCESS_TREE=$(docker exec "${SMOKE_CONTAINER}" ps aux 2>&1 || true)
            SANDBOX_INFO=$(docker exec "${SMOKE_CONTAINER}" find /opt /usr -name "*sandbox*" -ls 2>&1 || true)
            DPKG_FILES=$(docker exec "${SMOKE_CONTAINER}" dpkg -L brave-origin 2>&1 | head -n 40 || true)
            
            TOKEN="${REGISTRY_TOKEN:-${{ secrets.GITHUB_TOKEN }}}"
            if [ -n "${TOKEN}" ]; then
              REPORT=$(printf '### Smoke Test Execution Diagnostics\n**Status**: `%s`\n\n#### Sandbox Info:\n```text\n%s\n```\n\n#### DPKG Files:\n```text\n%s\n```\n\n#### Process Tree:\n```text\n%s\n```\n\n#### Brave Log:\n```text\n%s\n```\n\n#### Container Logs:\n```text\n%s\n```' "${STATUS_LOG}" "${SANDBOX_INFO}" "${DPKG_FILES}" "${PROCESS_TREE}" "${BRAVE_LOGS}" "${CONTAINER_LOGS}")
              JSON_PAYLOAD=$(python3 -c "import json, sys; print(json.dumps({'body': sys.argv[1]}))" "${REPORT}" 2>/dev/null || echo "{\"body\": \"report serialization failed\"}")
              curl -s -X POST -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" -d "${JSON_PAYLOAD}" "https://forgejo.foss.homes/api/v1/repos/shoy/brave-origin/issues/1/comments" || true
            fi
            
            docker logs "${SMOKE_CONTAINER}" 2>&1 || true
            docker rm --force "${SMOKE_CONTAINER}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "--- Testing Invalid KASM_AUTH_ENABLED Validation ---"
          INVALID_OUTPUT=$(docker run --rm -e KASM_AUTH_ENABLED=invalid "${LOCAL_IMAGE}" 2>&1 || true)
          echo "${INVALID_OUTPUT}" | grep "Invalid KASM_AUTH_ENABLED" && echo "Invalid auth value rejected: SUCCESS"

          echo "--- Testing KASM_AUTH_ENABLED=true Missing Credentials Validation ---"
          NO_CRED_OUTPUT=$(docker run --rm -e KASM_AUTH_ENABLED=true "${LOCAL_IMAGE}" 2>&1 || true)
          echo "${NO_CRED_OUTPUT}" | grep "no authentication credentials exist" && echo "Missing credentials rejected: SUCCESS"

          echo "--- Starting Primary Smoke Test Container (KASM_AUTH_ENABLED=false) ---"
          docker run --detach \
            --name "${SMOKE_CONTAINER}" \
            --shm-size=1g \
            --security-opt seccomp=unconfined \
            -e KASM_AUTH_ENABLED="false" \
            -e WEB_PORT="8443" \
            -e AUTO_UPDATE="false" \
            -e ENABLE_GPU="false" \
            "${LOCAL_IMAGE}"

          echo "Waiting 15 seconds for KasmVNC & Brave Origin startup..."
          sleep 15

          echo "--- Testing Direct HTTPS Web Endpoint Inside Container ---"
          docker exec "${SMOKE_CONTAINER}" curl -k -fsS https://127.0.0.1:8443/ >/dev/null && echo "Direct HTTPS check: SUCCESS"

          echo "--- Verifying Container Status ---"
          docker exec "${SMOKE_CONTAINER}" cat /config/state/status
          docker exec "${SMOKE_CONTAINER}" cat /config/state/last-brave-version

          echo "--- Container Process Tree ---"
          docker exec "${SMOKE_CONTAINER}" ps aux || true

          echo "--- Checking Process Running Status ---"
          docker exec "${SMOKE_CONTAINER}" pgrep -a -f "brave" || (echo "ERROR: Brave process not running!" && exit 1)
          docker exec "${SMOKE_CONTAINER}" pgrep -a -f "openbox" || (echo "ERROR: Openbox process not running!" && exit 1)
          docker exec "${SMOKE_CONTAINER}" pgrep -a -f "Xvnc" || (echo "ERROR: Xvnc process not running!" && exit 1)

          echo "--- Checking Brave Diagnostic Log ---"
          docker exec "${SMOKE_CONTAINER}" cat /config/state/brave.log 2>/dev/null || true

          echo "--- Checking Package Verification ---"
          docker exec "${SMOKE_CONTAINER}" dpkg-query -W -f='${Package} ${Version}\n' brave-origin
          ! docker exec "${SMOKE_CONTAINER}" dpkg -s brave-browser 2>/dev/null || (echo "ERROR: standard brave-browser found!" && exit 1)

          echo "=== Smoke Test Validation Succeeded ==="

      - name: Deploy Image to Forgejo Container Registry
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================================"
          echo " Finalizing Deployment to Forgejo Registry"
          echo "========================================================"
          
          TOKEN="${REGISTRY_TOKEN:-${{ secrets.GITHUB_TOKEN }}}"
          USERNAME="${REGISTRY_USERNAME:-shoy}"
          
          if [ -n "${TOKEN}" ]; then
            echo "--- Logging into Forgejo Registry (${REGISTRY}) as ${USERNAME} ---"
            printf '%s' "${TOKEN}" | docker login "${REGISTRY}" -u "${USERNAME}" --password-stdin
            
            echo "Pushing ${IMAGE_NAME}:latest..."
            docker push "${IMAGE_NAME}:latest"
            
            echo "Pushing ${IMAGE_NAME}:${{ github.sha }}..."
            docker push "${IMAGE_NAME}:${{ github.sha }}"
            
            echo "=== Image successfully published to Forgejo Container Registry! ==="
          else
            echo "Warning: No registry token provided. Skipping push."
          fi

          echo "========================================================"
          echo " SUCCESS: Brave Origin image is built, verified & deployed"
          echo " Available on Unraid host as: '${LOCAL_IMAGE}'"
          echo " Available in Registry as: '${IMAGE_NAME}:latest'"
          echo "========================================================"
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}

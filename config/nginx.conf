user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /config/state/nginx-error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /config/state/nginx-access.log;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 8443 ssl default_server;
        listen [::]:8443 ssl default_server;
        server_name _;

        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        # Optional Authentication Include
        include /etc/nginx/conf.d/auth.conf*;

        # Selkies Dashboard Static Web Client
        location / {
            root /usr/share/selkies/web;
            index index.html index.htm;
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Immutable Caching for Vite Content-Hashed Assets
        location /assets/ {
            root /usr/share/selkies/web;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Selkies Unified WebSocket Stream
        location /websocket {
            proxy_pass http://127.0.0.1:8082;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }
    }
}

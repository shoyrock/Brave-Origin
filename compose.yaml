services:
  brave-origin:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-forgejo.foss.homes/shoy/brave-origin:wayland}
    container_name: brave-origin
    hostname: ${CONTAINER_HOSTNAME:-brave-origin}
    restart: unless-stopped
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      # Container always listens on 8443 (nginx.conf); WEB_PORT only selects the host-side port.
      - "${WEB_PORT:-8443}:8443"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=${UMASK:-022}
      - TZ=${TZ:-UTC}
      - DISPLAY_WIDTH=${DISPLAY_WIDTH:-1920}
      - DISPLAY_HEIGHT=${DISPLAY_HEIGHT:-1080}
      - AUTH_ENABLED=${AUTH_ENABLED:-${KASM_AUTH_ENABLED:-false}}
      - AUTH_USER=${AUTH_USER:-${KASM_USER:-brave}}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-${KASM_PASSWORD:-}}
      - AUTH_PASSWORD_FILE=${AUTH_PASSWORD_FILE:-${KASM_PASSWORD_FILE:-}}
      - AUTO_UPDATE=${AUTO_UPDATE:-true}
      - UPDATE_INTERVAL=${UPDATE_INTERVAL:-21600}
      - DOWNGRADE_RETRY_INTERVAL=${DOWNGRADE_RETRY_INTERVAL:-300}
      - MIN_UPDATE_FREE_SPACE_MB=${MIN_UPDATE_FREE_SPACE_MB:-1024}
      - BRAVE_STARTUP_TIMEOUT=${BRAVE_STARTUP_TIMEOUT:-15}
      - BRAVE_ORIGIN_VERSION=${BRAVE_ORIGIN_VERSION:-latest}
      - ENABLE_GPU=${ENABLE_GPU:-true}
      - ENABLE_AUDIO=${ENABLE_AUDIO:-true}
      - DRI_NODE=${DRI_NODE:-/dev/dri/renderD128}
      - BRAVE_FLAGS=${BRAVE_FLAGS:-}
    volumes:
      - ${CONFIG_PATH:-./appdata}:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -k -fsS https://127.0.0.1:8443/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

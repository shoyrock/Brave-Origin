name: Build & Publish Brave Origin Image (GitHub)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/brave-origin
  LOCAL_IMAGE: brave-origin:wayland
  SMOKE_CONTAINER: brave-origin-gh-smoke-test

jobs:
  build-and-publish:
    name: Build, Smoke Test & Publish to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Brave Origin Wayland Docker Image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg "BUILD_COMMIT=${{ github.sha }}" \
            --tag "${LOCAL_IMAGE}" \
            --tag "${GHCR_IMAGE}:wayland" \
            --tag "${GHCR_IMAGE}:${{ github.sha }}" \
            .

      - name: Smoke Test Wayland Container Startup
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f "${SMOKE_CONTAINER}" >/dev/null 2>&1 || true
          docker run --detach \
            --name "${SMOKE_CONTAINER}" \
            --shm-size=1g \
            --security-opt seccomp=unconfined \
            --env PUID=1000 \
            --env PGID=1000 \
            --env TZ=Etc/UTC \
            --env AUTO_UPDATE=false \
            --env ENABLE_AUDIO=true \
            "${LOCAL_IMAGE}"
          sleep 30

          echo "--- Verifying official Brave Origin package ---"
          docker exec "${SMOKE_CONTAINER}" dpkg -l brave-origin

          echo "--- Verifying session processes ---"
          docker exec "${SMOKE_CONTAINER}" pgrep -x labwc
          docker exec "${SMOKE_CONTAINER}" pgrep -x brave

          echo "--- Verifying Selkies bound to loopback only ---"
          SELKIES_LISTEN=$(docker exec "${SMOKE_CONTAINER}" ss -tln | grep ':8082' || true)
          echo "${SELKIES_LISTEN}"
          if echo "${SELKIES_LISTEN}" | grep -q '0\.0\.0\.0:8082'; then
            echo "ERROR: Selkies listening on 0.0.0.0:8082!" >&2; exit 1
          fi
          if ! echo "${SELKIES_LISTEN}" | grep -q '127\.0\.0\.1:8082'; then
            echo "ERROR: Selkies not listening on 127.0.0.1:8082!" >&2; exit 1
          fi

          echo "--- Verifying Brave command line (Wayland, kiosk, no --no-sandbox) ---"
          BRAVE_CMD=$(docker exec "${SMOKE_CONTAINER}" ps -eo args | grep -F '/opt/brave.com/brave-origin/brave --ozone' | head -1)
          echo "${BRAVE_CMD}"
          if echo "${BRAVE_CMD}" | grep -q -- '--no-sandbox'; then
            echo "ERROR: Forbidden --no-sandbox flag found!" >&2; exit 1
          fi
          if ! echo "${BRAVE_CMD}" | grep -q 'ozone-platform=wayland'; then
            echo "ERROR: Missing --ozone-platform=wayland!" >&2; exit 1
          fi
          if ! echo "${BRAVE_CMD}" | grep -q -- '--kiosk'; then
            echo "ERROR: Missing --kiosk flag!" >&2; exit 1
          fi

          echo "--- Verifying Nginx TLS endpoint ---"
          HTTP_CODE=$(docker exec "${SMOKE_CONTAINER}" curl -k -s -o /dev/null -w "%{http_code}" https://127.0.0.1:8443/ || true)
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "ERROR: Nginx TLS endpoint returned ${HTTP_CODE} (expected 200)" >&2; exit 1
          fi

          docker stop -t 5 "${SMOKE_CONTAINER}" >/dev/null 2>&1 || true
          docker rm "${SMOKE_CONTAINER}" >/dev/null 2>&1 || true
          echo "Smoke Test: PASSED"

      - name: Publish Image to GitHub Container Registry
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${GHCR_IMAGE}:wayland"
          docker push "${GHCR_IMAGE}:${{ github.sha }}"
          docker tag "${LOCAL_IMAGE}" "${GHCR_IMAGE}:latest"
          docker push "${GHCR_IMAGE}:latest"
          echo "Published: ${GHCR_IMAGE}:wayland, :latest and :${{ github.sha }}"
